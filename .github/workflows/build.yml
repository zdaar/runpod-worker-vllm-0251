name: Build RunPod vLLM 0.25.1 worker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zdaar/runpod-worker-vllm-0251:v0.25.1-rp2.24.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make container package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH /user/packages/container/runpod-worker-vllm-0251 \
            -f visibility=public
